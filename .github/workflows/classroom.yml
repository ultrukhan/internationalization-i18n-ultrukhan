name: Autograding Tests
'on':
  push: {}
  repository_dispatch: {}
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: >-
      github.event.repository.is_template != true
      && github.actor != 'github-classroom[bot]'
      && !(github.event_name == 'push' && github.event.created
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Main test
      id: main-test
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Main test
        setup-command: npm install
        command: CI=true npm run e2e:headless
        timeout: 10
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        MAIN-TEST_RESULTS: "${{steps.main-test.outputs.result}}"
      with:
        runners: main-test
